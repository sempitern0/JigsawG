name: JigsawG Godot regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Import and headless regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2-stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project and run all fast scripts
        run: |
          python3 scripts/ci/run_tests.py \
            --godot ./Godot_v4.7.2-stable_linux.x86_64 \
            --timeout 120
